name: Checks

on:
  pull_request:

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run bank:status -- --check
      - run: npm run bank:insights -- --check
      - run: npm run decks:build -- --check
