<div style="margin:0;padding:32px 16px;background:#f6efe1;font-family:Nunito,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a3a36;">
  <div style="max-width:440px;margin:0 auto;background:#fdf9f1;border:3px solid #5b4741;border-radius:18px;padding:28px 24px;text-align:center;">
    <p style="margin:0 0 6px;font-size:22px;font-weight:800;">Your Plumi code</p>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.5;">Type this code where you're signing in.</p>
    <p style="margin:0 0 20px;font-size:34px;font-weight:800;letter-spacing:8px;font-family:'SF Mono',Menlo,Consolas,monospace;background:#fff4dd;border:2px dashed #d8c8ad;border-radius:12px;padding:14px 8px;">{{ .Token }}</p>
    <p style="margin:0 0 6px;font-size:13.5px;line-height:1.5;color:#6b5850;">Signing in on the website? You can use this link instead, in the same browser:</p>
    <p style="margin:0 0 20px;font-size:14px;"><a href="{{ .ConfirmationURL }}" style="color:#3266a3;font-weight:700;">Sign in to Plumi</a></p>
    <p style="margin:0;font-size:12.5px;line-height:1.5;color:#6b5850;">The code works once and expires in an hour. If you didn't ask for this, you can ignore this email.</p>
  </div>
</div>
